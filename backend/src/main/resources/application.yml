server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    max-connections: 10000
    accept-count: 500

spring:
  application:
    name: community-group-buy
  profiles:
    active: ${APP_PROFILE:dev}   # 默认 dev，生产环境变量覆盖 APP_PROFILE=prod

  # ====== MySQL 数据源 ======
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_group_buy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statement: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,slf4j
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
        login-username: admin
        login-password: ${DRUID_PASSWORD:druid123}
        allow: 127.0.0.1
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # ====== Redis ======
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  # ====== Flyway ======
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ====== Jackson ======
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # ====== Servlet multipart ======
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ====== MyBatis-Plus ======
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.project.groupbuy.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: false
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ====== 自定义业务配置 ======
business:
  stock-lock-timeout: 900
  jwt:
    secret: ${JWT_SECRET:community-group-buy-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration: 7200
    header: Authorization
    prefix: "Bearer "
  page:
    default-size: 10
    max-size: 100

# ====== Knife4j ======
knife4j:
  enable: false
  setting:
    language: zh_cn

# ====== 日志 ======
logging:
  level:
    root: INFO
    com.project.groupbuy: DEBUG
    com.project.groupbuy.mapper: DEBUG
    com.baomidou.mybatisplus: INFO
  file:
    name: logs/groupbuy.log
    max-size: 50MB
    max-history: 30
    total-cap-size: 5GB


# ====== 文件上传 ======
upload:
  dir: D:/Project/社区团购电商平台/backend/uploads/avatars
  max-size: 2097152   # 2MB
  allow-types: jpg,jpeg,png,gif,webp

